<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unscramble the Word Game! 🎮</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Title -->
        <div class="game-title">
            <h1>Unscramble the Word</h1>
            <div class="rainbow-icon">🌈</div>
        </div>
        
        <!-- Progress Bar -->
        <div class="progress-container">
            <span class="progress-label">🚀 Progress</span>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text">
                <span id="currentWord">1</span> / <span id="totalWords">8</span>
            </div>
        </div>

        <!-- Image Area -->
        <div class="image-container">
            <div class="image-placeholder" id="currentImage">🪁</div>
        </div>

        <!-- Answer Boxes -->
        <div class="answer-container">
            <div class="answer-box" data-position="0"></div>
            <div class="answer-box" data-position="1"></div>
            <div class="answer-box" data-position="2"></div>
            <div class="answer-box" data-position="3"></div>
        </div>

        <!-- Alphabet Tiles -->
        <div class="alphabet-container" id="alphabetContainer">
            <!-- Alphabet tiles will be generated by JavaScript -->
        </div>

        <!-- Check Button -->
        <button class="check-button" id="checkButton">Check Answer</button>

        <!-- Play Again Button (hidden initially) -->
        <button class="play-again-button" id="playAgainButton" style="display: none;">Play Again</button>
    </div>

    <!-- Message Overlay -->
    <div class="message-overlay" id="messageOverlay">
        <div class="message-content" id="messageContent"></div>
    </div>

    <!-- Fireworks Container -->
    <div class="fireworks-container" id="fireworksContainer"></div>

    <script src="script.js"></script>
</body>
</html>
